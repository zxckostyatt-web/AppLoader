name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DownloadHub.csproj

      - name: Build
        run: dotnet build DownloadHub.csproj -c Release --no-restore

      - name: Publish (одиночный exe)
        run: >
          dotnet publish DownloadHub.csproj
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish

      - name: Добавить catalog.json в артефакт (для истории релиза)
        shell: bash
        run: cp catalog.json publish/catalog.json

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: AppLoader-win-x64
          path: publish/

      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/DownloadHub.exe
            publish/catalog.json
